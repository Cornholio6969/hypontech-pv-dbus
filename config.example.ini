; dbus-hypon-pv configuration

[DEFAULT]
device_name = Hypontech PV
device_instance = 51
logging = INFO

[PV]
; 0 = AC input 1
; 1 = AC output
; 2 = AC input 2
position = 0
max_power = 6000

[HYPON]
base_url = https://api.hypon.cloud/v2
username = YOUR_HYPON_USERNAME
password = YOUR_HYPON_PASSWORD
system_id = YOUR_SYSTEM_ID

refresh_time = 30
failure_timeout = 300
http_timeout = 20
verify_ssl = true

login_endpoint = /login
login_method = POST
username_field = username
password_field = password

monitor_endpoint = /plant/{system_id}/monitor?refresh=true
monitor_method = GET

; Optional authentication and request overrides:
; token = PASTE_A_STATIC_TOKEN_HERE
; auth_header = Authorization
; auth_scheme = Bearer
; extra_headers_json = {"Origin":"https://www.hypon.cloud"}
; login_extra_json = {}
; monitor_body_json = {}

[MAPPING]
; Keys are checked from left to right. Nested paths such as data.power_pv work.
power_keys = power_pv,solar_power,pv_power,power
energy_keys = total_generation,total_energy,energy_total,e_total
today_energy_keys = today_generation,today_energy,e_day
voltage_keys = voltage,ac_voltage,vac
current_keys = current,ac_current,iac
frequency_keys = frequency,ac_frequency,freq

phase_count = 1
default_voltage = 230
default_frequency = 50
standby_power = 1
power_multiplier = 1
energy_multiplier = 1
